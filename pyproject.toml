[project]
name = "qq-nt-toolkit"
version = "1.0.0"
description = "面向 QQ NT 数据库的洁净室工具包：密钥恢复、SQLCipher 解密、查询/解析/导出库，以及用于 DataGrip 的 JDBC 驱动"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "BrokenCloud" }]
keywords = ["qq", "nt_msg.db", "sqlcipher", "wcdb", "forensics", "sqlite"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: System :: Systems Administration",
]
dependencies = [
    "cryptography>=41",
    "hanlp[full]>=2.1.5",
    "wordcloud>=1.9.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ntqq = "ntqq.cli:main"

[project.urls]
Documentation = "https://github.com/BrokenC1oud/NeoDB#readme"
Source = "https://github.com/BrokenC1oud/NeoDB"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

# ---------------------------------------------------------------------------
# tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["ntqq", "tests", "examples", "tools", "docs"]
# Only touch Python sources; ruff 0.17 would otherwise reflow the snippets in
# docs/*.md and lose their hand alignment.
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PIE", "RUF"]
ignore = [
  "E501",    # line length is the formatter's job
  "RUF012",  # QQ's column maps are intentionally mutable class attributes
  "BLE001",  # recovery code deliberately catches broad exceptions
  "N818",    # exception names follow the stdlib here
]
# 中文注释与 docstring 有意使用全角标点。
allowed-confusables = ["，", "：", "；", "？", "（", "）"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803"]
"tools/get_db_key.py" = ["S110"]  # gdb scripting helper

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.sources]
fasttext = { git = "https://github.com/facebookresearch/fastText" }
